services:
  - type: web
    name: system-atos-api
    runtime: docker
    plan: free
    rootDir: src/backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:$PORT
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Sso__PublicKeyPem
        sync: false
      - key: Sso__Issuer
        sync: false
      - key: Sso__Audience
        sync: false
      - key: Sso__ApiKey
        sync: false
      - key: Frontend__Origins
        sync: false
